# The firewalls Shall ships with (Part XI, riding K17's adapter table).
#
# Rows, not Rust — the same decision K17 made for settings stores, and for the same reason: a
# machine running a firewall nobody wrote an arm for should not have to wait for a release. A
# user adds one in `adapters/firewall.toml`.
#
# `{port}` and `{proto}` are substituted. `allow`/`deny` open and close a port; `default_in`
# and `default_out` set the policy for traffic no rule mentions; `list` reports what is in
# force, parsed by `list_pattern` (a regex whose first two groups are port and protocol) and,
# where the same command prints it, by `default_pattern` (first two groups: policy, direction).

[[firewall]]
name = "ufw"
os = "linux"
detect = "ufw"
allow = ["ufw", "allow", "{port}/{proto}"]
deny = ["ufw", "delete", "allow", "{port}/{proto}"]
default_in = ["ufw", "default", "{policy}", "incoming"]
default_out = ["ufw", "default", "{policy}", "outgoing"]
# `verbose` rather than `numbered`: it prints the `Default:` line as well as the rules, so the
# one command answers both questions `adopt` asks. The rule lines are the same either way —
# `list_pattern` tolerates the `[ 1]` numbering `numbered` adds — so `sync` reads the same
# perimeter it read before.
list = ["ufw", "status", "verbose"]
# `22/tcp   ALLOW IN  Anywhere`, numbered (`[ 1] 22/tcp`) or annotated (`22/tcp (OpenSSH)`).
# The port/proto is what identifies the rule. The bracketed part is the rule number or the rule's
# own name — never a port, which is why it is matched as a whole rather than as a loose run of
# digits that could swallow the port behind it.
list_pattern = '^\s*(?:\[\s*\d+\]\s*)?(\d+)/(tcp|udp)(?:\s*\([^)]*\))?\s+ALLOW'
# `Default: deny (incoming), allow (outgoing), disabled (routed)` — group 1 is the body of the
# line, read pair by pair. The third pair names a direction this model has none of, and is
# skipped rather than widened.
default_pattern = '(?m)^Default:(.*)$'

[[firewall]]
name = "firewalld"
os = "linux"
detect = "firewall-cmd"
allow = ["firewall-cmd", "--permanent", "--add-port={port}/{proto}"]
deny = ["firewall-cmd", "--permanent", "--remove-port={port}/{proto}"]
default_in = ["firewall-cmd", "--permanent", "--set-target={policy}"]
default_out = []
list = ["firewall-cmd", "--permanent", "--list-ports"]
list_pattern = '(\d+)/(tcp|udp)'
# No `default_pattern`: `--list-ports` names ports and nothing else, and firewalld's default
# lives in a zone target that is a second command this row does not carry. Absent is reported
# by `adopt` as "this firewall cannot say", not as "the default is open".

# Windows Defender Firewall. P7: Windows is not a later phase — a config that opens a port
# means the same thing on the Debian laptop and the Windows workstation, and that is the whole
# argument for a built-in backend rather than a per-machine `[[backend]]` definition.
[[firewall]]
name = "windows-defender"
os = "windows"
detect = "netsh"
allow = [
  "netsh", "advfirewall", "firewall", "add", "rule",
  "name=Shall {port}/{proto}", "dir=in", "action=allow",
  "protocol={proto}", "localport={port}",
]
deny = [
  "netsh", "advfirewall", "firewall", "delete", "rule",
  "name=Shall {port}/{proto}",
]
default_in = ["netsh", "advfirewall", "set", "allprofiles", "firewallpolicy", "{policy}"]
default_out = []
list = ["netsh", "advfirewall", "firewall", "show", "rule", "name=all"]
# Only the rules Shall itself named: `show rule` lists every rule with its name, action and
# port on separate lines, so a port on a line of its own is not attributable to a rule without
# a state machine. The bound is a row limitation, and it is why only Shall's own rules are
# adopted on Windows — the rest are reported as unreadable, never as absent.
list_pattern = 'Shall (\d+)/(tcp|udp)'
# No `default_pattern`: netsh states the policy as one line carrying both directions
# (`BlockInbound,AllowOutbound`), which a two-group pattern cannot split honestly.
